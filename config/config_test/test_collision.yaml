# Test collision management services

package: curobo_ros
environment:
  launch:
    - package: curobo_ros
      executable: gen_traj_test.launch.py
      name: gen_traj
  # Readiness is probed, not guessed: the planner node blocks its executor for
  # 25-35s building cuRobo solvers inside __init__ (it serves nothing until the
  # constructor returns), so the former `startup_delay: 30.0` was racing it --
  # measured margin ranged from +0.9s to -4.5s, which is exactly why `colcon
  # test` failed on a different subset of suites every run.
  # Waited for by *advertisement*, never called: the node creates this service
  # only after _warmup_initial_planner returns (unified_planner_node.py), so its
  # appearance in the graph is the readiness signal. Deliberately NOT
  # is_available -- that service reads an attribute the node never defines, so
  # it raises on every call and is slated for removal.
  ready_service: "/unified_planner/generate_trajectory"
  ready_wait: 180.0
  startup_delay: 0.0
  ready_timeout: 90.0  # ReadyToTest budget, loader-side (default is 15s)

tests:
  - name: "01 Get collision distance"
    service: "/unified_planner/get_collision_distance"
    type: curobo_msgs/srv/GetCollisionDistance
    data: {}
    expect: {}

  - name: "02 Set collision cache OBB"
    service: "/unified_planner/set_collision_cache"
    type: curobo_msgs/srv/SetCollisionCache
    # timeout=30: a cache value actually changing triggers a synchronous
    # solver rebuild+warmup (~20s, see rebuild_solvers_for_cache_change).
    timeout: 30.0
    data: {obb: 100, mesh: -1, blox: -1}
    expect: {success: True, obb_cache: 100, blox_cache: 1}

  - name: "02b Disable collision cache voxel"
    service: "/unified_planner/set_collision_cache"
    type: curobo_msgs/srv/SetCollisionCache
    timeout: 30.0  # see "02" — same rebuild-on-change cost
    data: {obb: -1, mesh: -1, blox: 0}
    expect: {success: True, blox_cache: 0}

  - name: "02c Re-enable collision cache voxel"
    service: "/unified_planner/set_collision_cache"
    type: curobo_msgs/srv/SetCollisionCache
    timeout: 30.0  # see "02" — same rebuild-on-change cost
    data: {obb: -1, mesh: -1, blox: 1}
    expect: {success: True, blox_cache: 1}

  - name: "03 Update motion gen config"
    service: "/unified_planner/update_motion_gen_config"
    type: std_srvs/srv/Trigger
    # timeout=30: always rebuilds + warms up the MotionPlanner (~20s),
    # unconditionally (unlike set_collision_cache, which only rebuilds on an
    # actual value change).
    timeout: 30.0
    data: {}
    expect: {success: True}

  - name: "04 Disable link collision"
    service: "/unified_planner/set_link_collision"
    type: curobo_msgs/srv/SetLinkCollision
    data:
      link_names: ['dsr01/link6']
      enabled: false
    expect: {success: True}

  - name: "05 Re-enable link collision"
    service: "/unified_planner/set_link_collision"
    type: curobo_msgs/srv/SetLinkCollision
    data:
      link_names: ['dsr01/link6']
      enabled: true
    expect: {success: True}
