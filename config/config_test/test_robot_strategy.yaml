# Test robot strategy services

package: curobo_ros
environment:
  launch:
    - package: curobo_ros
      executable: gen_traj_test.launch.py
      name: gen_traj
  # Readiness is probed, not guessed: the planner node blocks its executor for
  # 25-35s building cuRobo solvers inside __init__ (it serves nothing until the
  # constructor returns), so the former `startup_delay: 30.0` was racing it --
  # measured margin ranged from +0.9s to -4.5s, which is exactly why `colcon
  # test` failed on a different subset of suites every run.
  # Waited for by *advertisement*, never called: the node creates this service
  # only after _warmup_initial_planner returns (unified_planner_node.py), so its
  # appearance in the graph is the readiness signal. There is deliberately no
  # readiness service to call: the node exposes its state as the
  # `node_is_available` parameter.
  ready_service: "/unified_planner/generate_trajectory"
  ready_wait: 180.0
  startup_delay: 0.0
  ready_timeout: 90.0  # ReadyToTest budget, loader-side (default is 15s)
  allowable_exit_codes: [0, -2, -9]
  
tests:
  - name: "01 Get robot strategies"
    service: "/unified_planner/get_robot_strategies"
    type: curobo_msgs/srv/GetRobotStrategies
    data: {}
    expect: {success: True}

  - name: "02 Set strategy emulator"
    service: "/unified_planner/set_robot_strategy"
    type: curobo_msgs/srv/SetRobotStrategy
    data: {robot_strategy: "emulator"}
    expect: {success: True}

  - name: "03 Set strategy doosan"
    service: "/unified_planner/set_robot_strategy"
    type: curobo_msgs/srv/SetRobotStrategy
    data: {robot_strategy: "joint_speed"}
    expect: {success: True}
