# Test to add and remove an object from curobo

package: curobo_ros
environment:
  launch:
      - package: curobo_ros
        executable: gen_traj_test.launch.py
        name: gen_traj
  # Readiness is probed, not guessed: the planner node blocks its executor for
  # 25-35s building cuRobo solvers inside __init__ (it serves nothing until the
  # constructor returns), so the former `startup_delay: 30.0` was racing it --
  # measured margin ranged from +0.9s to -4.5s, which is exactly why `colcon
  # test` failed on a different subset of suites every run.
  # Waited for by *advertisement*, never called: the node creates this service
  # only after _warmup_initial_planner returns (unified_planner_node.py), so its
  # appearance in the graph is the readiness signal. There is deliberately no
  # readiness service to call: the node exposes its state as the
  # `node_is_available` parameter.
  ready_service: "/unified_planner/generate_trajectory"
  ready_wait: 180.0
  startup_delay: 0.0
  ready_timeout: 90.0  # ReadyToTest budget, loader-side (default is 15s)
  allowable_exit_codes: [0, -2, -9]

tests:
  - name: "01 Add object"
    service: "/unified_planner/add_object"
    type: curobo_msgs/srv/AddObject
    # timeout=90: the node starts its cuRobo warmup synchronously in __init__;
    # the first service call may block until warmup completes. Measured ~25s on
    # an idle Orin, ~37s once the SoC throttles under sustained GPU load.
    timeout: 90.0
    data: {type: 0,
            name: "cube",
            mesh_file_path: "",
            pose: {position: {x: 0.0, y: 0.0, z: 0.0},
                  orientation: {x: 0.0, y: 0.0, z: 0.0, w: 0.0}},
            dimensions: {x: 0.5, y: 0.5, z: 0.5},
            color: {r: 0.0, a: 0.0}
          }
    expect: {success: True,
             message: "Object 'cube' added (1 cuboids, 0 meshes)"}

  - name: "02 Add second object"
    service: "/unified_planner/add_object"
    type: curobo_msgs/srv/AddObject
    # An ordinary scene obstacle -- unrelated to the attach tested in case 05,
    # which now carries its own inline geometry and never touches the Scene
    # (see AttachmentServices). 4 cm is arbitrary here; case 05 has its own
    # size rationale (attach link sphere budget).
    data: {type: 0,
            name: "cube2",
            mesh_file_path: "",
            pose: {position: {x: 0.5, y: 0.5, z: 0.5},
                  orientation: {x: 0.0, y: 0.0, z: 0.0, w: 0.0}},
            dimensions: {x: 0.04, y: 0.04, z: 0.04},
            color: {r: 0.0, a: 0.0}
          }
    expect: {success: True,
             message: "Object 'cube2' added (2 cuboids, 0 meshes)"}

  - name: "03 Get obstacles"
    service: "/unified_planner/get_obstacles"
    type: std_srvs/srv/Trigger
    data: {}
    expect: {success: True}

  - name: "04 Get voxel grid"
    service: "/unified_planner/get_voxel_grid"
    type: curobo_msgs/srv/GetVoxelGrid
    # v2: bounds derive from mapper_extent_xyz (2.0 m, centered) at voxel_size
    # 0.05 m -> ceil(2.0/0.05) = 40 per axis, 40^3 = 64000 cells.
    # $sum_min: obstacles are rasterized into the grid from their analytic
    # primitives. The 0.5 m cube alone fills 10^3 = 1000 cells; the 4 cm cube
    # adds only a handful. 500 is a deliberately loose floor -- it proves the
    # grid is populated without depending on exact voxel boundary alignment.
    data: {}
    expect:
      voxel_grid:
        size_x: 40
        size_y: 40
        size_z: 40
        data: {$len: 64000, $sum_min: 500}

  - name: "05 Attach inline geometry"
    service: "/unified_planner/attach_object"
    type: curobo_msgs/srv/AttachObject
    # No preceding add_object: the payload never enters the Scene (see
    # AttachmentServices) -- its geometry travels entirely inline in this
    # request. 4 cm to fit within the attach link's 4 sphere slots
    # (extra_collision_spheres.attached_object in m1013.yml) -- beyond that
    # the attach still succeeds but on a truncated model, and the test would
    # be validating a geometry that isn't the payload's real shape.
    # A normalized quaternion is required: this pose feeds an FK composition,
    # unlike the (0,0,0,0) tolerated elsewhere in this file by add_object.
    # header.frame_id = the gripper link (tool_frames[0] in m1013.yml): 5 cm
    # in front of the flange, independent of the arm's configuration -- what
    # makes the expected result independent of the home pose, and therefore
    # testable without calibrating a world-frame value. TF is available under
    # test: gen_traj.launch.py starts robot_state_publisher + joint_state_publisher.
    # frame_id: "" would target the base frame and skip the TF lookup entirely.
    data: {header: {frame_id: "dsr01/link6"}, type: 0,
            pose: {position: {x: 0.0, y: 0.0, z: 0.05},
                   orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}},
            dimensions: {x: 0.04, y: 0.04, z: 0.04}}
    timeout: 90.0
    expect: {success: True, message: "Attached payload to link 'attached_object'"}

  - name: "06 Switch to LBFGS while attached"
    service: "/unified_planner/set_planner"
    type: curobo_msgs/srv/SetPlanner
    # The inline payload from case 05 is attached under Classic (the only
    # planner warm at startup). Switching to LBFGS exercises the replay hook
    # (ReactiveController.ensure_solver() -> UnifiedPlannerNode.replay_attachment()
    # -> AttachmentServices.reapply()) that carries the attach onto a solver
    # built AFTER attach_object was called -- before this feature, LBFGS never
    # saw a payload attached under any other planner at all.
    # planner_type: 2 -> 'lbfgs' (PlannerFactory._PLANNER_CATALOG); the
    # SetPlanner.srv constant for this id is still named BATCH, a naming
    # leftover from before LBFGS replaced the unimplemented batch planner.
    # timeout=90: LBFGS's solver does not exist yet at this point in the
    # suite (only Classic was warmed at startup), so this is the one call
    # here that pays a full solver build (~25-37s, see case 01).
    data: {planner_type: 2}
    timeout: 90.0
    expect:
      success: True
      previous_planner: "Classic Motion Generation"
      current_planner: "LBFGS Model Predictive Control"
      message: "Successfully switched to LBFGS Model Predictive Control"

  - name: "07 Attached spheres visible to LBFGS"
    service: "/unified_planner/get_collision_distance"
    type: curobo_msgs/srv/GetCollisionDistance
    # Regression test for the bug this locks in: get_collision_distance used
    # to resolve its solver from a hardcoded motion_planner/mpc/ik_solver
    # chain that never included lbfgs (node.ik_solver doesn't even exist --
    # dead code), so this call returned nb_sphere=0 for any lbfgs-only
    # session. It now resolves through AttachmentServices.active_manager(),
    # the currently ACTIVE planner (LBFGS since case 06).
    # nb_sphere=17 is a structural constant of m1013.yml, independent of
    # whether a payload is actually attached: 13 fixed arm spheres
    # (collision_spheres: link1=1, link2=5, link3=1, link4=4, link5=1,
    # link6=1, counted programmatically, not by eye) + 4 slots reserved for
    # attached_object (extra_collision_spheres). So this proves the service
    # resolves LBFGS's real kinematics at all (17, not 0) -- it does not by
    # itself prove the payload's spheres are populated (case 05 already
    # asserts the attach call itself succeeded).
    data: {}
    expect:
      nb_sphere: 17
      data: {$len: 17}

  - name: "09 Add object while attached"
    service: "/unified_planner/add_object"
    type: curobo_msgs/srv/AddObject
    # The payload attached in case 05 lives only as fitted spheres on the arm
    # -- it was never added to the Scene, so a world push here (add_object ->
    # ObstacleManager's world-changed notification -> update_all_solvers_world
    # -> SceneCollision.load_collision_model -> clear()+re-add) has nothing of
    # the payload's to double-count by construction (the bug this design
    # replaces -- see the plan's Context). Placed far from the robot
    # (mapper_extent_xyz is [2,2,2] centered) so it cannot itself perturb
    # collision_distance's values -- this case only re-exercises the world-push
    # code path with an attach live, to catch any future regression that
    # routes the payload back through the Scene.
    data: {type: 0,
            name: "trigger",
            mesh_file_path: "",
            pose: {position: {x: -0.8, y: 0.0, z: -0.8},
                  orientation: {x: 0.0, y: 0.0, z: 0.0, w: 0.0}},
            dimensions: {x: 0.05, y: 0.05, z: 0.05},
            color: {r: 0.0, a: 0.0}
          }
    expect: {success: True,
             message: "Object 'trigger' added (3 cuboids, 0 meshes)"}

  - name: "10 Collision distance survives a world push"
    service: "/unified_planner/get_collision_distance"
    type: curobo_msgs/srv/GetCollisionDistance
    # Deliberately weak: nb_sphere is a structural constant (see case 07),
    # so this only proves get_collision_distance keeps resolving LBFGS's
    # kinematics cleanly after a world push with an attach live -- it does
    # NOT assert that the attached_object sphere distances themselves are
    # unaffected by the new obstacle. Asserting that needs either a live run
    # to calibrate a threshold or a $min/$max-style generator operator --
    # this environment has neither ros2_test_compose installed to check nor
    # a spare live session to measure against (see
    # docs/getting-started/testing.md). The plan's Vérification section has
    # the manual procedure instead.
    data: {}
    expect:
      nb_sphere: 17
      data: {$len: 17}

  - name: "11 Detach object"
    service: "/unified_planner/detach_object"
    type: std_srvs/srv/Trigger
    # Resets the attached_object link's spheres. Nothing is injected into the
    # world -- the payload was never in the Scene to begin with (see
    # AttachmentServices.detach).
    data: {}
    expect: {success: True, message: "Detached payload"}

  - name: "12 Remove object"
    service: "/unified_planner/remove_object"
    type: curobo_msgs/srv/RemoveObject
    data: {name: "cube"}
    expect: {success: True,
             message: "Object 'cube' removed from cuboids"}

  - name: "13 Remove all objects"
    service: "/unified_planner/remove_all_objects"
    type: std_srvs/srv/Trigger
    # cube2 (case 02) and trigger (case 09) are still in the scene -- only
    # 'cube' was individually removed (case 12).
    data: {}
    expect: {success: True,
            message: "All 2 obstacles removed"}

